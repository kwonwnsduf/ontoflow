[project]
name = "ontoflow-ai-service"
version = "0.1.0"
description = "OntoFlow AI orchestration service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.120.3",
  "pydantic-settings==2.11.0",
  "python-json-logger==4.0.0",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

