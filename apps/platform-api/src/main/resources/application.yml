spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontoflow}
    username: ${DB_USERNAME:ontoflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /docs
ontoflow:
  auth:
    jwt-secret: ${JWT_SECRET}
    web-origin: ${WEB_ORIGIN:http://localhost:3000}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  security:
    internal-api-key: ${INTERNAL_API_KEY:}
server:
  forward-headers-strategy: none
  shutdown: graceful
logging:
  structured:
    format:
      console: logstash
