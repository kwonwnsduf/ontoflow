name: ontoflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in .env}
      FUSEKI_DATASET_1: ontoflow
    ports: ["3030:3030"]
    volumes: ["fuseki-data:/fuseki"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3030/$/ping >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging

  n8n:
    image: n8nio/n8n:1.117.1
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:?Set N8N_USER in .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?Set N8N_PASSWORD in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: "5678"
    ports: ["5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  platform-api:
    build: ./apps/platform-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_API_KEY: ${PLATFORM_API_INTERNAL_KEY:?Set PLATFORM_API_INTERNAL_KEY in .env}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  ai-service:
    build: ./apps/ai-service
    environment:
      APP_ENV: local
      INTERNAL_API_KEY: ${PLATFORM_API_INTERNAL_KEY:?Set PLATFORM_API_INTERNAL_KEY in .env}
      LOG_LEVEL: INFO
    ports: ["8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_PLATFORM_API_URL: ${NEXT_PUBLIC_PLATFORM_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_PLATFORM_API_URL: ${NEXT_PUBLIC_PLATFORM_API_URL:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on:
      platform-api: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  mock-enterprise:
    build: ./apps/mock-enterprise
    environment:
      PORT: "8090"
    ports: ["8090:8090"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  platform-api-test:
    build:
      context: ./apps/platform-api
      target: build
    command: ["gradle", "test", "--no-daemon"]
    profiles: ["test"]

  ai-service-test:
    build:
      context: ./apps/ai-service
      target: test
    command: ["sh", "-c", "ruff check . && pytest"]
    profiles: ["test"]

  web-test:
    build:
      context: ./apps/web
      target: deps
    command: ["sh", "-c", "pnpm lint && pnpm test && pnpm build"]
    profiles: ["test"]

volumes:
  postgres-data:
  redis-data:
  fuseki-data:
  n8n-data:
