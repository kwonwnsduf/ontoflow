name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-api:
    runs-on: ubuntu-latest
    env:
      REDIS_HOST: localhost
    services:
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: ontoflow_test
          POSTGRES_USER: ontoflow
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontoflow -d ontoflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test --no-daemon
        working-directory: apps/platform-api
      - name: PostgreSQL migration and isolation tests
        run: gradle test --rerun-tasks --no-daemon
        working-directory: apps/platform-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ontoflow_test
          SPRING_DATASOURCE_USERNAME: ontoflow
          SPRING_DATASOURCE_PASSWORD: ci-test-only

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
      - run: uv sync --frozen
        working-directory: apps/ai-service
      - run: uv run ruff check .
        working-directory: apps/ai-service
      - run: uv run pytest
        working-directory: apps/ai-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint && pnpm test && pnpm build
        working-directory: apps/web

  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npx --yes prettier@3.6.2 --check "**/*.{json,yml,yaml}"
      - run: docker compose --env-file .env.example config --quiet
      - run: node --test
        working-directory: apps/mock-enterprise
